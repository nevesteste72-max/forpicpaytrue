<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Painel · Saúde Bovina</title>
  <style>
    *{box-sizing:border-box;margin:0}
    body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#f4f1ea;color:#29180d;padding:16px;max-width:520px;margin:0 auto}
    h1{font-size:1.15rem;margin:2px 0}
    .sub{color:#8a7a68;font-size:.8rem;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(27,60,32,.06)}
    .card .lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#a97f22;margin-bottom:6px}
    .card .big{font-size:1.9rem;font-weight:800;line-height:1}
    .card .small{font-size:.8rem;color:#6b5a49;margin-top:4px}
    .full{grid-column:1/3}
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    td{padding:9px 4px}
    .foot{text-align:center;color:#b3a692;font-size:.72rem;margin-top:16px}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1b7a34;margin-right:5px;animation:p 1.6s infinite;vertical-align:middle}
    @keyframes p{50%{opacity:.3}}
    .err{background:#fff;border-radius:16px;padding:30px 20px;text-align:center;color:#8a7a68}
  </style>
</head>
<body>
  <h1>🐄 Saúde Bovina — Painel</h1>
  <div class="sub" id="sub"><span class="dot"></span>A carregar…</div>
  <div id="app"></div>
  <div class="foot">Saúde Bovina · dados em tempo real</div>

  <script>
    var params = new URLSearchParams(location.search);
    var k = params.get('k') || '';
    var ENDPOINT = 'https://gbtlzwzmbgkcdkdnnbxg.supabase.co/functions/v1/painel?k=' + encodeURIComponent(k);

    function eur(n){ return '€' + Number(n||0).toFixed(2).replace('.', ','); }
    function relMin(iso){
      if(!iso) return '—';
      var m = Math.floor((Date.now() - new Date(iso).getTime())/60000);
      if(m < 60) return 'há ' + Math.max(0,m) + ' min';
      var h = Math.floor(m/60);
      if(h < 24) return 'há ' + h + ' h';
      return 'há ' + Math.floor(h/24) + ' dias';
    }
    function hm(iso){
      try{ return new Date(iso).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Lisbon'}); }catch(e){ return ''; }
    }

    function render(d){
      var linhas = (d.ultimas && d.ultimas.length)
        ? d.ultimas.map(function(r){
            return '<tr><td style="font-weight:700;color:#1b5e20">' + eur(r.amount) + '</td>' +
                   '<td style="color:#555">' + r.plano + '</td>' +
                   '<td style="color:#999;text-align:right;white-space:nowrap">' + hm(r.created_at) + ' · ' + relMin(r.created_at) + '</td></tr>';
          }).join('')
        : '<tr><td colspan="3" style="color:#999">Sem vendas ainda hoje.</td></tr>';

      document.getElementById('app').innerHTML =
        '<div class="grid">' +
          '<div class="card"><div class="lbl">Vendas hoje</div><div class="big">' + d.vendas_hoje + '</div><div class="small">' + eur(d.receita_hoje) + '</div></div>' +
          '<div class="card"><div class="lbl">Checkouts hoje</div><div class="big">' + d.checkouts_hoje + '</div><div class="small">chegaram ao pagamento</div></div>' +
          '<div class="card"><div class="lbl">Fila recuperação</div><div class="big">' + d.fila + '</div><div class="small">abandonos/falhados</div></div>' +
          '<div class="card"><div class="lbl">Última atividade</div><div class="big" style="font-size:1.2rem">' + relMin(d.ultima_atividade) + '</div><div class="small">7 dias: ' + d.vendas_7d + ' vendas</div></div>' +
          '<div class="card full"><div class="lbl">Últimas vendas · ' + eur(d.receita_7d) + ' (7d)</div><table>' + linhas + '</table></div>' +
        '</div>';

      document.getElementById('sub').innerHTML = '<span class="dot"></span>Ao vivo · atualizado às ' + hm(d.gerado_em) + ' · recarrega sozinho';
    }

    function load(){
      fetch(ENDPOINT, { cache:'no-store' })
        .then(function(r){ if(!r.ok) throw new Error('http'); return r.text(); })
        .then(function(t){ render(JSON.parse(t)); })
        .catch(function(){
          document.getElementById('app').innerHTML = '<div class="err">🔒 Link inválido ou erro ao carregar.<br>Confirma que o link tem o código <b>?k=…</b> completo.</div>';
          document.getElementById('sub').innerHTML = '';
        });
    }

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
